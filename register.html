<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Best Cars</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>Best Cars</h1><nav><a href="/">Home</a><a href="/static/About.html">About Us</a><a href="/static/Contact.html">Contact Us</a></nav></header><main><h2>Create an account</h2>
<form id="register" class="review-form"><label>Username <input name="userName" placeholder="Username" required></label><label>First Name <input name="firstName" placeholder="First Name"></label><label>Last Name <input name="lastName" placeholder="Last Name"></label><label>Email <input name="email" type="email" placeholder="Email" required></label><label>Password <input name="password" type="password" placeholder="Password" minlength="8" required></label><button type="submit">Register</button></form><p id="status" role="status"></p></main>
<script>document.getElementById('register').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/djangoapp/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const data=await r.json();document.getElementById('status').textContent=r.ok?'Account created. Return home and sign in.':data.error||'Registration failed.'});</script></body></html>
