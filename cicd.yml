name: Best Cars Capstone CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate rubric paths and required content
        run: python scripts/validate_submission.py
      - name: Check Python and Node syntax
        run: |
          python -m compileall -q server scripts tests
          node --check server/database/app.js
          node --check server/frontend/vite.config.js
      - name: Test real local Node and sentiment endpoints
        run: python -m unittest discover -s tests -v
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Django requirements
        run: python -m pip install -r server/requirements.txt
      - name: Run Django tests
        working-directory: server
        run: python manage.py test djangoapp -v 2
  react-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install React frontend
        working-directory: server/frontend
        run: npm install --no-audit --no-fund
      - name: Build React application
        working-directory: server/frontend
        run: npm run build
