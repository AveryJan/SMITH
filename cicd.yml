name: Capstone CI
on:
  push:
  pull_request:
jobs:
  verify-project-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check capstone paths and content
        run: python scripts/validate_submission.py
      - name: Check Python syntax
        run: |
          python - <<'PYCODE'
          import pathlib,py_compile
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' not in p.parts:
                  py_compile.compile(str(p),doraise=True)
          print('Python syntax checks passed')
          PYCODE
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Django tests when backend exists
        run: |
          if [ -f server/manage.py ] && [ -f server/requirements.txt ]; then
            pip install -r server/requirements.txt
            cd server && python manage.py test
          else
            echo 'Backend is not included in this correction package; Django integration tests not run.'
          fi
